<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>psychostasia</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: rgb(40, 40, 44);
        font: 14px/1.5 ui-monospace, Menlo, monospace;
      }
      #scale3d { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
      svg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
      video {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
      }
      #panel { z-index: 3; }
      #panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #eee;
        padding: 12px 16px;
        border-radius: 8px;
      }
      #place { font-size: 20px; letter-spacing: 0.2em; }
      #held { color: #ffd36b; white-space: pre-wrap; margin-top: 8px; }
      #error { color: #ff6b6b; white-space: pre-wrap; margin-top: 8px; }
      #readout { margin: 8px 0 0; }
      #panel { max-height: calc(100vh - 32px); overflow-y: auto; }

      /* Glyph tray and window — the black and white of @qntx/glyphs' own
         examples: the tray is a fixed right-edge column, the dots carry the
         pointer events, a window is reached through [data-manifestation]. */
      .glyph-run {
        position: fixed;
        top: 50%;
        right: 4px;
        transform: translateY(-50%);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        pointer-events: none;
        width: fit-content;
      }
      .glyph-run-indicators {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        width: fit-content;
        height: fit-content;
      }
      .glyph-run-glyph {
        pointer-events: auto;
        cursor: pointer;
        font-size: 12px;
        overflow: hidden;
        border: 1px solid #fff;
        color: #fff;
      }
      .glyph-run-glyph:hover { filter: brightness(1.6); }
      [data-manifestation="window"] {
        pointer-events: auto;
        border: 1px solid #fff;
        color: #fff;
      }
      .glyph-title-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        height: 32px;
        width: 100%;
        background-color: #000;
        border-bottom: 1px solid #fff;
        flex-shrink: 0;
        user-select: none;
        cursor: move;
        font-size: 12px;
        color: #fff;
      }
      .glyph-title-bar button {
        width: 22px;
        height: 22px;
        padding: 1px 2px;
        background: #000;
        color: #fff;
        border: 1px solid #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        margin-left: 2px;
      }
      .glyph-title-bar button:hover { background: #fff; color: #000; }
      .glyph-content-area { flex: 1 1 auto; overflow: auto; padding: 8px; }
      .glyph-content { font-size: 12px; line-height: 1.6; }

      /* tweak */
      /* The glyph element carries an inline white-space: nowrap that every
         manifestation inherits; tweak's content wraps again from its own root,
         so a label never runs under its slider or gets cut off. */
      .tweak { white-space: normal; }
      .tweak-row { display: grid; grid-template-columns: 170px 1fr 64px; gap: 8px; align-items: center; }
      .tweak-row span { overflow-wrap: break-word; word-break: break-word; }
      .tweak-group { margin-top: 10px; color: #ffd36b; }
      .tweak input[type='number'] { width: 64px; font: inherit; }
      .tweak-actions { margin-top: 10px; display: flex; gap: 8px; }
      .tweak-json { font-size: 11px; color: #bbb; }
    </style>
  </head>
  <body>
    <!-- muted: a clip's own audio would reach the mic and be judged -->
    <video id="hell" src="/hell.mp4" autoplay muted loop playsinline></video>
    <canvas id="scale3d"></canvas>
    <svg viewBox="0 0 800 640" preserveAspectRatio="xMidYMid meet">
      <g id="devil" style="opacity: 0" transform="translate(400 120) scale(0.9)">
        <path d="M30,80 C90,90 90,20 110,10" fill="none" stroke="#7a1010" stroke-width="5" />
        <path d="M104,2 L122,4 L112,20 Z" fill="#7a1010" />
        <path d="M-28,-25 L28,-25 L40,95 L-40,95 Z" fill="#7a1010" />
        <path d="M-18,-62 L-30,-100 L-6,-70 Z M18,-62 L30,-100 L6,-70 Z" fill="#2a0a0a" />
        <circle cy="-50" r="22" fill="#c0271d" />
        <circle cx="-8" cy="-54" r="3" fill="#ffd400" />
        <circle cx="8" cy="-54" r="3" fill="#ffd400" />
        <line x1="-60" y1="-60" x2="-60" y2="100" stroke="#333" stroke-width="5" />
        <path d="M-75,-60 L-75,-85 M-60,-60 L-60,-92 M-45,-60 L-45,-85 M-77,-60 L-43,-60" stroke="#333" stroke-width="4" fill="none" />
      </g>

    </svg>

    <div id="panel">
      <div id="place">EARTH</div>
      <div id="held" hidden></div>
      <div id="error" hidden></div>
      <!-- "c" hides and shows the readout; the tweaks live in the tray -->
      <div id="controls-panel">
        <pre id="readout"></pre>
      </div>
    </div>
    <script>
      // main.ts marks itself booted; if it never does, say so on the page.
      setTimeout(() => {
        const box = document.getElementById('error')
        if (document.documentElement.dataset.booted || !box.hidden) return
        box.textContent =
          'main.ts did not boot: it threw while loading or never loaded.\n' +
          'The stack is in the browser console.'
        box.hidden = false
      }, 3000)
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>

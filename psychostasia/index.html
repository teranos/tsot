<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>psychostasia</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: rgb(40, 40, 44);
        font: 14px/1.5 ui-monospace, Menlo, monospace;
      }
      #scale3d { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
      svg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
      video {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
      }
      #panel { z-index: 3; }
      #panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #eee;
        padding: 12px 16px;
        border-radius: 8px;
      }
      #place { font-size: 20px; letter-spacing: 0.2em; }
      #held { color: #ffd36b; white-space: pre-wrap; margin-top: 8px; }
      #error { color: #ff6b6b; white-space: pre-wrap; margin-top: 8px; }
      #readout { margin: 8px 0 0; }
      #panel { max-height: calc(100vh - 32px); overflow-y: auto; }
      #controls label { display: grid; grid-template-columns: 170px 160px 70px; gap: 8px; align-items: center; }
      #controls .group { margin-top: 10px; color: #ffd36b; }
      #controls input[type='number'] { width: 64px; font: inherit; }
      #look-json { font-size: 11px; color: #bbb; }
    </style>
  </head>
  <body>
    <!-- muted: a clip's own audio would reach the mic and be judged -->
    <video id="hell" src="/hell.mp4" autoplay muted loop playsinline></video>
    <canvas id="scale3d"></canvas>
    <svg viewBox="0 0 800 640" preserveAspectRatio="xMidYMid meet">
      <g id="devil" style="opacity: 0" transform="translate(400 120) scale(0.9)">
        <path d="M30,80 C90,90 90,20 110,10" fill="none" stroke="#7a1010" stroke-width="5" />
        <path d="M104,2 L122,4 L112,20 Z" fill="#7a1010" />
        <path d="M-28,-25 L28,-25 L40,95 L-40,95 Z" fill="#7a1010" />
        <path d="M-18,-62 L-30,-100 L-6,-70 Z M18,-62 L30,-100 L6,-70 Z" fill="#2a0a0a" />
        <circle cy="-50" r="22" fill="#c0271d" />
        <circle cx="-8" cy="-54" r="3" fill="#ffd400" />
        <circle cx="8" cy="-54" r="3" fill="#ffd400" />
        <line x1="-60" y1="-60" x2="-60" y2="100" stroke="#333" stroke-width="5" />
        <path d="M-75,-60 L-75,-85 M-60,-60 L-60,-92 M-45,-60 L-45,-85 M-77,-60 L-43,-60" stroke="#333" stroke-width="4" fill="none" />
      </g>

    </svg>

    <div id="panel">
      <div id="place">EARTH</div>
      <div id="held" hidden></div>
      <div id="error" hidden></div>
      <!-- "c" hides and shows the readout and the controls -->
      <div id="controls-panel">
        <pre id="readout"></pre>
        <div id="controls"></div>
        <button id="look-copy">copy look</button>
        <button id="look-reset">reset look</button>
        <pre id="look-json"></pre>
      </div>
    </div>
    <script>
      // main.ts marks itself booted; if it never does, say so on the page.
      setTimeout(() => {
        const box = document.getElementById('error')
        if (document.documentElement.dataset.booted || !box.hidden) return
        box.textContent =
          'main.ts did not boot: it threw while loading or never loaded.\n' +
          'The stack is in the browser console.'
        box.hidden = false
      }, 3000)
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
